apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-web
  labels:
    app: gitops-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gitops-web
  template:
    metadata:
      labels:
        app: gitops-web
    spec:
      containers:
      - name: web
        image: nginx:1.26
        ports:
        - containerPort: 80
